<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RSS Feed Manager - Manage UK news RSS feeds with ease">
    <meta name="theme-color" content="#4F46E5">
    <title>RSS Feed Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           DESIGN SYSTEM: Glassmorphism with Soft Gradients
           - Typography: Poppins (display) + Inter (body)
           - Colors: Indigo (#4F46E5), Lavender (#F3E8FF), Blue (#EFF6FF)
           - Effects: Glassmorphism, soft shadows, smooth transitions
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F3E8FF 0%, #EFF6FF 100%);
            color: #1F2937;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================
           CONTAINER & LAYOUT
           ============================================ */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }
        }

        /* ============================================
           HEADER SECTION
           ============================================ */

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #4F46E5;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1rem;
            color: #6B7280;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.875rem;
            }
        }

        /* ============================================
           CARD CONTAINER (Glassmorphism)
           ============================================ */

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.1);
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        @media (max-width: 768px) {
            .card {
                padding: 1.5rem;
            }
        }

        /* ============================================
           CONTROLS SECTION
           ============================================ */

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.5);
            color: #1F2937;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-box::placeholder {
            color: #9CA3AF;
        }

        /* ============================================
           BUTTON STYLES
           ============================================ */

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(79, 70, 229, 0.1);
            color: #4F46E5;
            border: 1px solid rgba(79, 70, 229, 0.3);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(79, 70, 229, 0.15);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ============================================
           TABLE STYLES
           ============================================ */

        .table-wrapper {
            overflow-x: auto;
            border-radius: 1rem;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: rgba(79, 70, 229, 0.08);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #4F46E5;
            border-bottom: 2px solid rgba(79, 70, 229, 0.2);
            font-family: 'Poppins', sans-serif;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(79, 70, 229, 0.1);
            color: #374151;
        }

        tbody tr {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.4s ease-out both;
        }

        tbody tr:nth-child(1) { animation-delay: 0.3s; }
        tbody tr:nth-child(2) { animation-delay: 0.35s; }
        tbody tr:nth-child(3) { animation-delay: 0.4s; }
        tbody tr:nth-child(4) { animation-delay: 0.45s; }
        tbody tr:nth-child(5) { animation-delay: 0.5s; }
        tbody tr:nth-child(n+6) { animation-delay: 0.55s; }

        tbody tr:hover {
            background: rgba(79, 70, 229, 0.05);
        }

        .feed-name {
            font-weight: 600;
            color: #1F2937;
        }

        .feed-url {
            color: #4F46E5;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .copy-btn {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            background: rgba(79, 70, 229, 0.1);
            color: #4F46E5;
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: rgba(79, 70, 229, 0.2);
            transform: scale(1.05);
        }

        .copy-btn.copied {
            background: rgba(34, 197, 94, 0.2);
            color: #22C55E;
            border-color: rgba(34, 197, 94, 0.3);
        }

        /* ============================================
           EMPTY STATE
           ============================================ */

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #9CA3AF;
        }

        .empty-state svg {
            width: 4rem;
            height: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* ============================================
           STATS SECTION
           ============================================ */

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: rgba(79, 70, 229, 0.05);
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            background: rgba(79, 70, 229, 0.1);
            transform: translateY(-2px);
        }

        .stat-value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #4F46E5;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #6B7280;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        /* ============================================
           TOAST NOTIFICATIONS
           ============================================ */

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            max-width: 300px;
            animation: slideInRight 0.3s ease-out;
            z-index: 1000;
        }

        .toast.success {
            border-left: 4px solid #22C55E;
        }

        .toast.error {
            border-left: 4px solid #EF4444;
        }

        .toast.info {
            border-left: 4px solid #4F46E5;
        }

        @media (max-width: 640px) {
            .toast {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                max-width: none;
            }
        }

        /* ============================================
           ANIMATIONS
           ============================================ */

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        /* ============================================
           LOADING STATE
           ============================================ */

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #6B7280;
        }

        .loading svg {
            width: 1.5rem;
            height: 1.5rem;
            margin-right: 0.75rem;
            animation: spin 1s linear infinite;
        }

        /* ============================================
           RESPONSIVE ADJUSTMENTS
           ============================================ */

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: auto;
            }

            button {
                width: 100%;
                justify-content: center;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 0.75rem;
            }

            .feed-url {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 RSS Feed Manager</h1>
            <p>Manage UK news RSS feeds with ease</p>
        </header>

        <div class="card">
            <div class="controls">
                <input 
                    type="text" 
                    class="search-box" 
                    id="searchInput" 
                    placeholder="Search feeds by name or URL..."
                    aria-label="Search RSS feeds"
                >
                <button class="btn-primary" id="generateBtn" onclick="generateFeeds()">
                    <span>✨</span> Generate Feeds
                </button>
                <button class="btn-secondary" id="copyBtn" onclick="copyAllToClipboard()" disabled>
                    <span>📋</span> Copy All
                </button>
            </div>

            <div class="table-wrapper">
                <table id="feedsTable">
                    <thead>
                        <tr>
                            <th>News Source</th>
                            <th>RSS Feed URL</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="feedsBody">
                        <tr>
                            <td colspan="3" class="empty-state">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 12a8 8 0 0 1 15.993-.5M4.07 12a8 8 0 0 0 15.86.5M12 2v8m0 8v2"></path>
                                </svg>
                                <p>Click "Generate Feeds" to populate the table with UK news RSS feeds</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="stats" id="statsContainer" style="display: none;">
                <div class="stat-card">
                    <div class="stat-value" id="totalFeeds">0</div>
                    <div class="stat-label">Total Feeds</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="visibleFeeds">0</div>
                    <div class="stat-label">Visible Feeds</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="copiedCount">0</div>
                    <div class="stat-label">Copied URLs</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // RSS FEEDS DATA - 15+ UK News Sources
        // ============================================

        const UK_RSS_FEEDS = [
            { name: 'BBC News', url: 'http://feeds.bbc.co.uk/news/rss.xml' },
            { name: 'BBC World', url: 'http://feeds.bbc.co.uk/news/world/rss.xml' },
            { name: 'BBC UK', url: 'http://feeds.bbc.co.uk/news/uk/rss.xml' },
            { name: 'BBC Technology', url: 'http://feeds.bbc.co.uk/news/technology/rss.xml' },
            { name: 'The Guardian', url: 'https://www.theguardian.com/international/rss' },
            { name: 'The Guardian UK', url: 'https://www.theguardian.com/uk/rss' },
            { name: 'The Guardian World', url: 'https://www.theguardian.com/world/rss' },
            { name: 'The Telegraph', url: 'https://www.telegraph.co.uk/news/rss' },
            { name: 'The Telegraph UK', url: 'https://www.telegraph.co.uk/news/uknews/rss' },
            { name: 'The Times', url: 'https://www.thetimes.co.uk/rss' },
            { name: 'The Independent', url: 'https://www.independent.co.uk/news/rss' },
            { name: 'Sky News', url: 'https://feeds.skynews.com/feeds/rss/home.xml' },
            { name: 'Sky News UK', url: 'https://feeds.skynews.com/feeds/rss/uk.xml' },
            { name: 'ITV News', url: 'https://www.itv.com/news/rss' },
            { name: 'Channel 4 News', url: 'https://www.channel4.com/news/rss' },
            { name: 'Reuters UK', url: 'https://www.reuters.com/uk' },
            { name: 'Financial Times', url: 'https://feeds.ft.com/home/rss' },
            { name: 'The Economist', url: 'https://www.economist.com/the-world-in-brief/rss.xml' },
        ];

        let allFeeds = [];
        let copiedCount = 0;

        // ============================================
        // MAIN FUNCTIONS
        // ============================================

        function generateFeeds() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner">⏳</span> Generating...';

            // Simulate loading delay for better UX
            setTimeout(() => {
                allFeeds = [...UK_RSS_FEEDS];
                renderFeeds(allFeeds);
                document.getElementById('copyBtn').disabled = false;
                document.getElementById('statsContainer').style.display = 'grid';
                updateStats();
                showToast(`✅ Loaded ${allFeeds.length} RSS feeds!`, 'success');
                btn.disabled = false;
                btn.innerHTML = '<span>✨</span> Generate Feeds';
            }, 500);
        }

        function renderFeeds(feeds) {
            const tbody = document.getElementById('feedsBody');
            
            if (feeds.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <p>No feeds match your search</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = feeds.map((feed, index) => `
                <tr>
                    <td class="feed-name">${escapeHtml(feed.name)}</td>
                    <td class="feed-url">${escapeHtml(feed.url)}</td>
                    <td>
                        <button class="copy-btn" onclick="copySingleFeed('${escapeHtml(feed.url)}', this)" title="Copy URL">
                            📋 Copy
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function copySingleFeed(url, button) {
            navigator.clipboard.writeText(url).then(() => {
                copiedCount++;
                updateStats();
                
                // Visual feedback
                const originalText = button.textContent;
                button.textContent = '✅ Copied!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);

                showToast('✅ URL copied to clipboard!', 'success');
            }).catch(() => {
                showToast('❌ Failed to copy URL', 'error');
            });
        }

        function copyAllToClipboard() {
            if (allFeeds.length === 0) {
                showToast('⚠️ No feeds to copy', 'info');
                return;
            }

            const feedsText = allFeeds
                .map(feed => `${feed.name}: ${feed.url}`)
                .join('\n');

            navigator.clipboard.writeText(feedsText).then(() => {
                copiedCount += allFeeds.length;
                updateStats();
                showToast(`✅ Copied ${allFeeds.length} feeds to clipboard!`, 'success');
            }).catch(() => {
                showToast('❌ Failed to copy feeds', 'error');
            });
        }

        function filterFeeds() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (!searchTerm) {
                renderFeeds(allFeeds);
            } else {
                const filtered = allFeeds.filter(feed =>
                    feed.name.toLowerCase().includes(searchTerm) ||
                    feed.url.toLowerCase().includes(searchTerm)
                );
                renderFeeds(filtered);
            }

            updateStats();
        }

        function updateStats() {
            const tbody = document.getElementById('feedsBody');
            const visibleRows = tbody.querySelectorAll('tr:not(:has(td[colspan]))').length;
            
            document.getElementById('totalFeeds').textContent = allFeeds.length;
            document.getElementById('visibleFeeds').textContent = visibleRows;
            document.getElementById('copiedCount').textContent = copiedCount;
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        document.getElementById('searchInput').addEventListener('input', filterFeeds);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });

        // ============================================
        // SERVICE WORKER - PWA SUPPORT
        // ============================================

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                self.addEventListener('install', () => self.skipWaiting());
                self.addEventListener('activate', () => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    if (e.request.method === 'GET') {
                        e.respondWith(
                            caches.open('v1').then(cache => {
                                return cache.match(e.request).then(response => {
                                    return response || fetch(e.request).then(response => {
                                        cache.put(e.request, response.clone());
                                        return response;
                                    });
                                });
                            }).catch(() => fetch(e.request))
                        );
                    }
                });
            `)).catch(() => {});
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        console.log('RSS Feed Manager initialized. Press Ctrl+K to search.');
    </script>
</body>
</html>
