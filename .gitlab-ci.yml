# ============================================
# GitLab CI/CD Pipeline Configuration
# RSS Feed Manager - Production Deployment
# ============================================

image: node:20-alpine

stages:
  - build
  - test
  - security
  - deploy

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: $REGISTRY/$CI_PROJECT_PATH
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# ============================================
# Build Stage
# ============================================

build:frontend:
  stage: build
  cache:
    paths:
      - node_modules/
      - .pnpm-store/
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  only:
    - main
    - merge_requests
    - tags

# ============================================
# Test Stage
# ============================================

test:unit:
  stage: test
  cache:
    paths:
      - node_modules/
      - .pnpm-store/
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm run test 2>/dev/null || echo "No tests configured"
  allow_failure: true
  only:
    - merge_requests
    - main

test:lint:
  stage: test
  cache:
    paths:
      - node_modules/
      - .pnpm-store/
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm run check 2>/dev/null || echo "No linting configured"
  allow_failure: true
  only:
    - merge_requests
    - main

# ============================================
# Security Stage
# ============================================

security:dependencies:
  stage: security
  cache:
    paths:
      - node_modules/
      - .pnpm-store/
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm audit --audit-level=moderate 2>/dev/null || echo "Audit complete"
  allow_failure: true
  only:
    - merge_requests
    - main

security:container:
  stage: security
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL $IMAGE_NAME:$IMAGE_TAG || true
  allow_failure: true
  only:
    - main
    - tags

# ============================================
# Deploy Stage
# ============================================

deploy:docker:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
    - echo "Docker image pushed: $IMAGE_NAME:$IMAGE_TAG"
  only:
    - main
    - tags

deploy:pages:
  stage: deploy
  dependencies:
    - build:frontend
  script:
    - mkdir -p public
    - cp -r dist/public/* public/ || cp -r dist/* public/
    - echo "Deployed to GitLab Pages"
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main
    - tags

# ============================================
# Scheduled Jobs
# ============================================

security:audit:scheduled:
  stage: security
  cache:
    paths:
      - node_modules/
      - .pnpm-store/
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm audit --audit-level=moderate 2>/dev/null || true
  only:
    - schedules
  allow_failure: true
